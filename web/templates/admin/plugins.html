{% extends "base.html" %}
{% set active_section = "plugins" %}

{% block title %}Plugins — Sushi Admin{% endblock %}
{% block main_attrs %} x-data="pluginsPage()"{% endblock %}

{% block content %}
  <h1 class="text-2xl font-bold mb-6">Plugins</h1>
  <div class="bg-white rounded shadow overflow-hidden">
    <table class="w-full">
      <thead>
        <tr class="bg-gray-50 border-b">
          <th class="px-4 py-2 text-left">Name</th>
          <th class="px-4 py-2 text-left">Version</th>
          <th class="px-4 py-2 text-left">Description</th>
          <th class="px-4 py-2">Status</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="p in plugins" :key="p.name">
          <tr class="border-b hover:bg-gray-50">
            <td class="px-4 py-2" x-text="p.name"></td>
            <td class="px-4 py-2" x-text="p.version"></td>
            <td class="px-4 py-2" x-text="p.description"></td>
            <td class="px-4 py-2 text-center">
              <span class="px-2 py-1 rounded text-sm"
                :class="p.loaded ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
                x-text="p.loaded ? 'Active' : 'Inactive'"></span>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
{% endblock %}

{% block scripts %}
  <script src="{{ static_url_prefix | default(value="/static") }}/admin/js/plugins.js"></script>
{% endblock %}
