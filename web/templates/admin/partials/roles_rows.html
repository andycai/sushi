{% for role in roles %}
  <tr
    data-row-search="{{ role.slug }} {{ role.name }} {{ role.description }} users:{{ role.user_count }} permissions:{{ role.permission_count }}"
    data-row-sort="{{ role.slug }}"
    data-role-id="{{ role.id }}"
    data-role-slug="{{ role.slug }}"
    data-role-name="{{ role.name }}"
    data-role-description="{{ role.description }}"
    data-role-system="{{ role.is_system }}"
  >
    <td>
      <div class="font-semibold">{{ role.name }}</div>
      <div class="ui-results-text ui-mono">{{ role.slug }}</div>
    </td>
    <td>{{ role.description | default(value="No description") }}</td>
    <td>
      <span class="ui-badge muted">{{ role.permission_count }} permissions</span>
    </td>
    <td>
      <span class="ui-badge info">{{ role.user_count }} users</span>
    </td>
    <td class="actions">
      <button type="button" class="ui-action-link" @click="openRoleEditor($el.closest('tr').dataset)">Edit</button>
      <button type="button" class="ui-action-link" @click="openRolePermissions($el.closest('tr').dataset)">Permissions</button>
      {% if role.is_system %}
        <span class="ui-badge muted">System</span>
      {% else %}
        <button type="button" class="ui-action-link danger" @click="openDelete($el.closest('tr').dataset)">Delete</button>
      {% endif %}
    </td>
  </tr>
{% else %}
  <tr>
    <td colspan="5" class="ui-empty">No roles found.</td>
  </tr>
{% endfor %}
