{% extends "base.html" %}

{% block title %}Login — Sushi Admin{% endblock %}
{% block nav %}{% endblock %}
{% block additional_main_classes %}flex items-center justify-center{% endblock %}

{% block content %}
  <div class="w-full max-w-sm">
    <div class="bg-white rounded-lg shadow-md p-8">
      <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Sushi Admin</h1>
      <div id="error" class="mb-4 p-3 bg-red-100 text-red-700 rounded text-sm hidden"></div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username"
            class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password"
            class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <button type="submit" id="submitBtn"
          class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-medium">Sign In</button>
      </form>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script src="{{ static_url_prefix | default(value="/static") }}/admin/js/login.js"></script>
{% endblock %}
