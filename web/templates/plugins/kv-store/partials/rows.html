{% if error_message %}
  <tr>
    <td colspan="3" class="px-4 py-3 bg-red-50 text-red-700 text-sm">{{ error_message }}</td>
  </tr>
{% endif %}

{% for item in items %}
  <tr class="border-b hover:bg-gray-50">
    <td class="px-4 py-3 font-mono text-sm">{{ item.key }}</td>
    <td class="px-4 py-3 font-mono text-sm truncate max-w-xs">{{ item.value }}</td>
    <td class="px-4 py-3 text-right">
      <button
        type="button"
        data-key="{{ item.key }}"
        data-value="{{ item.value }}"
        @click="openEdit($el.dataset.key, $el.dataset.value)"
        class="text-blue-600 hover:text-blue-800 mr-3 text-sm font-medium"
      >
        Edit
      </button>
      <button
        type="button"
        data-key="{{ item.key }}"
        class="text-red-600 hover:text-red-800 text-sm font-medium"
        @click="openDeleteConfirm($el.dataset.key)"
      >
        Delete
      </button>
    </td>
  </tr>
{% else %}
  <tr>
    <td colspan="3" class="px-4 py-8 text-center text-gray-500">No entries found. Add one to get started.</td>
  </tr>
{% endfor %}
