<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="15" fill="#1a1a2e"/>
  
  <!-- Sushi roll body -->
  <ellipse cx="16" cy="16" rx="10" ry="8" fill="#f4f1ea" stroke="#2d2d44" stroke-width="1.5"/>
  
  <!-- Nori (seaweed) wrap -->
  <path d="M6 16 Q16 10 26 16" fill="none" stroke="#2d5016" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M6 16 Q16 22 26 16" fill="none" stroke="#2d5016" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Rice grains pattern -->
  <circle cx="12" cy="14" r="0.8" fill="#e8e4dd"/>
  <circle cx="14" cy="13" r="0.8" fill="#e8e4dd"/>
  <circle cx="18" cy="13" r="0.8" fill="#e8e4dd"/>
  <circle cx="20" cy="14" r="0.8" fill="#e8e4dd"/>
  <circle cx="11" cy="16" r="0.8" fill="#e8e4dd"/>
  <circle cx="21" cy="16" r="0.8" fill="#e8e4dd"/>
  <circle cx="12" cy="18" r="0.8" fill="#e8e4dd"/>
  <circle cx="14" cy="19" r="0.8" fill="#e8e4dd"/>
  <circle cx="18" cy="19" r="0.8" fill="#e8e4dd"/>
  <circle cx="20" cy="18" r="0.8" fill="#e8e4dd"/>
  
  <!-- Fillings (salmon/pink) -->
  <circle cx="16" cy="16" r="3" fill="#ff6b8a"/>
  <circle cx="15" cy="15" r="1.5" fill="#ff8fa3"/>
  
  <!-- Accent dot (roe/caviar) -->
  <circle cx="16" cy="14" r="1" fill="#ffd700"/>
  
  <!-- Chopsticks accent -->
  <line x1="4" y1="6" x2="10" y2="4" stroke="#d4a574" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="5" y1="7" x2="11" y2="5" stroke="#d4a574" stroke-width="1.2" stroke-linecap="round"/>
</svg>
