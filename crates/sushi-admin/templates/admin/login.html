<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Sushi Admin</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body>
<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Sushi Admin</h1>
    <div id="error" class="mb-4 p-3 bg-red-100 text-red-700 rounded text-sm hidden"></div>
    <form id="loginForm">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" required autocomplete="username"
          class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required autocomplete="current-password"
          class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <button type="submit" id="submitBtn"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-medium">Sign In</button>
    </form>
  </div>
</div>
<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('error');
  btn.disabled = true; btn.textContent = 'Signing in...';
  err.classList.add('hidden');
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    document.cookie = 'sushi_token=' + data.access_token + '; path=/; SameSite=Lax; max-age=86400';
    window.location.href = '/admin';
  } catch(e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}
document.getElementById('loginForm').addEventListener('submit', handleLogin);
</script>
</body></html>
