<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs — Sushi Admin</title>
<script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<body class="bg-gray-100 min-h-screen">
<div class="flex h-screen">
  <nav class="w-60 bg-gray-900 text-white flex-shrink-0">
    <div class="p-4 text-xl font-bold border-b border-gray-700">Sushi Admin</div>
    <div class="mt-4">
      <a href="/admin/" class="block px-4 py-2 hover:bg-gray-700">Dashboard</a>
      <a href="/admin/plugins" class="block px-4 py-2 hover:bg-gray-700">Plugins</a>
      <a href="/admin/users" class="block px-4 py-2 hover:bg-gray-700">Users</a>
      <a href="/admin/config" class="block px-4 py-2 hover:bg-gray-700">Config</a>
      <a href="/admin/kv" class="block px-4 py-2 hover:bg-gray-700">KV Store</a>
      <a href="/admin/logs" class="block px-4 py-2 bg-gray-700">Logs</a>
    </div>
  </nav>
  <main class="flex-1 p-6 flex flex-col" x-data="logsPage()">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold">Logs</h1>
      <div class="flex items-center gap-3">
        <span x-show="loading" class="text-sm text-gray-500">Refreshing...</span>
        <button @click="loadLogs" class="text-sm border px-3 py-1 rounded hover:bg-gray-100">Refresh</button>
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" x-model="autoRefresh" class="rounded">
          Auto-refresh (5s)
        </label>
      </div>
    </div>

    <div class="flex-1 bg-gray-900 rounded shadow overflow-hidden flex flex-col">
      <div x-show="logs.length === 0 && !error" class="p-6 text-gray-400 text-center">
        No logs available yet.
      </div>
      <div x-show="error" class="p-4 text-red-400 text-sm" x-text="error"></div>
      <div class="flex-1 overflow-auto p-4 font-mono text-sm space-y-1" style="max-height: calc(100vh - 160px)">
        <template x-for="(log, i) in logs" :key="i">
          <div class="flex gap-3 text-gray-300 hover:bg-gray-800/50 px-2 py-1 rounded">
            <span class="text-gray-500 shrink-0" x-text="log.timestamp"></span>
            <span class="shrink-0 px-1.5 py-0.5 rounded text-xs font-medium"
              :class="{
                'bg-blue-900 text-blue-300': log.level === 'INFO',
                'bg-yellow-900 text-yellow-300': log.level === 'WARN',
                'bg-red-900 text-red-300': log.level === 'ERROR',
                'bg-gray-700 text-gray-300': log.level === 'DEBUG'
              }" x-text="log.level"></span>
            <span class="text-gray-300" x-text="log.message"></span>
          </div>
        </template>
      </div>
    </div>
  </main>
</div>
<script>
function logsPage() {
  return {
    logs: [],
    error: null,
    loading: false,
    autoRefresh: false,
    _interval: null,
    async init() { await this.loadLogs(); },
    async loadLogs() {
      this.loading = true;
      this.error = null;
      try {
        const resp = await fetch('/admin/api/logs');
        if (!resp.ok) throw new Error('Failed to fetch logs');
        const data = await resp.json();
        this.logs = data.logs || [];
      } catch (e) {
        this.error = 'Could not load logs. Is the logs endpoint configured?';
      }
      this.loading = false;
    },
    $watch('autoRefresh', (val) => {
      if (this._interval) { clearInterval(this._interval); this._interval = null; }
      if (val) this._interval = setInterval(() => this.loadLogs(), 5000);
    })
  };
}
</script>
</body></html>
