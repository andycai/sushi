schema_version = 1

[plugin]
name = "kv-store"
version = "0.2.0"
description = "KV store management — API, admin UI, and CLI"
entry = "init.lua"

[permissions]
routes = true
commands = true
admin = true
database = "admin"

[policies]
scopes = ["api.kv.*", "admin.kv.manage", "cli.kv.*"]

[admin.assets.bundles.workspace]
js = ["kv.js"]
css = []
