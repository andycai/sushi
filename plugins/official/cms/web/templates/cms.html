{% extends "base.html" %}
{% set active_section = "plugins" %}
{% block title %}CMS — Sushi Admin{% endblock %}
{% block content %}
<section
  class="admin-module cms-workbench"
  data-admin-workspace-module="cms"
  data-cms-editor-save-url="/admin/partials/cms/editor/save"
  data-cms-status-transition-url="/admin/partials/cms/status/transition"
  x-data="cmsPage()"
  x-init="init()"
>
  <header class="cms-top-nav ui-card" data-cms-top-nav>
    <div class="cms-top-nav-left">
      <h1 class="ui-title">CMS workspace</h1>
      <p class="ui-subtitle">Editorial workbench for pages, posts, and categories.</p>
    </div>

    <nav class="cms-top-nav-center" aria-label="CMS navigation">
      <button type="button" class="ui-btn ui-btn-ghost" :class="{ 'is-active': isNavActive('overview') }" @click="goOverview()">Overview</button>
      <button type="button" class="ui-btn ui-btn-ghost" :class="{ 'is-active': isNavActive('posts') }" @click="goLibrary('posts')">Posts</button>
      <button type="button" class="ui-btn ui-btn-ghost" :class="{ 'is-active': isNavActive('pages') }" @click="goLibrary('pages')">Pages</button>
      <button type="button" class="ui-btn ui-btn-ghost" :class="{ 'is-active': isNavActive('categories') }" @click="goLibrary('categories')">Categories</button>
    </nav>

    <div class="cms-top-nav-right">
      <button type="button" class="ui-btn ui-btn-secondary" @click="openCommandPalette()" title="Cmd/Ctrl+K">Command</button>
      <button type="button" class="ui-btn ui-btn-primary" @click="openEditor('posts', 'new')">New Post</button>
      <button type="button" class="ui-btn ui-btn-primary" @click="openEditor('pages', 'new')">New Page</button>
    </div>
  </header>

  <div id="cms-feedback" class="ui-feedback"></div>

  <section
    id="cms-overview-panel"
    class="cms-panel"
    data-cms-panel="overview"
    x-show="isPanel('overview')"
    x-cloak
    hx-get="/admin/partials/cms/overview"
    hx-trigger="load, cms:panel:overview from:body"
    hx-swap="innerHTML"
  ></section>

  <section
    id="cms-library-panel"
    class="cms-panel"
    data-cms-panel="library"
    x-show="isPanel('library')"
    x-cloak
    hx-get="/admin/partials/cms/library/posts"
    hx-trigger="cms:panel:library from:body, cms:library:refresh from:body"
    hx-swap="innerHTML"
  ></section>

  <section
    id="cms-editor-panel"
    class="cms-panel"
    data-cms-panel="editor"
    x-show="isPanel('editor')"
    x-cloak
    hx-get="/admin/partials/cms/editor/posts/new"
    hx-trigger="cms:panel:editor from:body, cms:editor:refresh from:body"
    hx-swap="innerHTML"
  ></section>

  <section class="cms-command-overlay" x-show="commandOpen" x-cloak @click.self="closeCommandPalette()">
    <div id="cms-command-panel"
      class="cms-command-shell"
      hx-get="/admin/partials/cms/commands"
      hx-trigger="revealed, cms:commands:refresh from:body"
      hx-swap="innerHTML"
    ></div>
  </section>
</section>
{% endblock %}
