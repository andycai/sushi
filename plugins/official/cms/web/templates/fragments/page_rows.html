{% for item in items %}
<tr data-cms-row data-resource="pages" data-slug="{{ item.slug }}" class="align-middle">
  <td class="font-mono text-xs sm:text-sm">{{ item.slug }}</td>
  <td>{{ item.title }}</td>
  <td>
    <form class="cms-inline-form" hx-post="/admin/partials/cms/status/transition" hx-target="#cms-feedback" hx-swap="innerHTML">
      <input type="hidden" name="resource" value="pages">
      <input type="hidden" name="slug" value="{{ item.slug }}">
      <select name="next_status" class="select select-bordered select-sm">
        <option value="draft" {% if item.status == "draft" %}selected{% endif %}>Draft</option>
        <option value="published" {% if item.status == "published" %}selected{% endif %}>Published</option>
        <option value="archived" {% if item.status == "archived" %}selected{% endif %}>Archived</option>
      </select>
      <button type="submit" class="btn btn-sm btn-ghost">Apply</button>
    </form>
  </td>
  <td class="text-right">
    <div class="cms-row-actions">
      <button type="button" class="btn btn-sm btn-outline" data-cms-open-editor data-resource="pages" data-slug="{{ item.slug }}">Edit</button>
      {% if item.status == "published" %}
      <a class="btn btn-sm btn-ghost" href="/app/pages/{{ item.slug }}" target="_blank" rel="noopener">Preview</a>
      {% else %}
      <a class="btn btn-sm btn-ghost" href="/admin/preview/cms/pages/{{ item.slug }}" target="_blank" rel="noopener">Preview</a>
      {% endif %}
      <form hx-post="/admin/partials/cms/pages/delete" hx-target="#cms-feedback" hx-swap="innerHTML">
        <input type="hidden" name="slug" value="{{ item.slug }}">
        <button type="submit" class="btn btn-sm btn-outline btn-error" data-confirm="Delete this page?">Delete</button>
      </form>
    </div>
  </td>
</tr>
{% else %}
<tr>
  <td colspan="4" class="py-6 text-center text-sm text-base-content/60">No pages found.</td>
</tr>
{% endfor %}
