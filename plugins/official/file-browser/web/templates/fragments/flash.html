{% set tone_class = "alert-info" %}
{% if tone == "success" %}
{% set tone_class = "alert-success" %}
{% elif tone == "error" %}
{% set tone_class = "alert-error" %}
{% endif %}
<div class="alert {{ tone_class }} border border-base-300 px-3 py-2 text-sm shadow-sm" role="alert">
  {{ message }}
</div>
