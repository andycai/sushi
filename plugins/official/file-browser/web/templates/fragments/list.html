<div class="card border border-base-300 bg-base-100 shadow-sm" data-fb-list-root="{{ rel_path }}" data-admin-table-card>
  {% if list_error %}
  <div class="alert alert-error rounded-none rounded-t-box border-0 border-b border-base-300 py-2 text-xs">{{ list_error }}</div>
  {% endif %}

  <div class="fb-tree-list w-full space-y-0.5 p-1 text-xs" data-fb-list-entries="1">
    {% for item in entries %}
    {% if item.is_dir %}
    <div class="fb-tree-group w-full min-w-0">
      <div class="fb-node-row flex w-full min-w-0 items-center justify-between gap-1 rounded-lg border border-transparent px-0.5 py-0 transition" data-fb-node="1" data-kind="dir" data-path="{{ item.path }}" data-fb-action="toggle-dir">
        <div class="min-w-0 flex flex-1 items-center gap-0.5">
          <button
            type="button"
            class="btn btn-ghost btn-xs h-5 w-5 min-h-5 px-0"
            data-fb-action="toggle-dir"
            data-path="{{ item.path }}"
            aria-label="Toggle folder"
            aria-expanded="false"
            aria-busy="false"
          >
            <span class="fb-chevron grid h-4 w-4 place-items-center transition-transform" data-fb-chevron="{{ item.path }}">
              <svg class="h-3.5 w-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" aria-hidden="true">
                <path d="M5.25 3.5L8.75 7L5.25 10.5"/>
              </svg>
            </span>
          </button>
          <button
            type="button"
            class="fb-node-label min-w-0 flex flex-1 items-center gap-1 rounded-md px-0.5 py-0 text-left"
            data-fb-action="toggle-dir"
            data-path="{{ item.path }}"
          >
            <span class="grid h-4 w-4 shrink-0 place-items-center text-primary/80">
              <svg class="h-3.5 w-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" aria-hidden="true">
                <path d="M1.75 4.25h3.75l1.25 1.5h5.5v5.5a1 1 0 0 1-1 1H2.75a1 1 0 0 1-1-1z"/>
              </svg>
            </span>
            <span class="fb-node-name truncate" title="{{ item.name }}" data-fb-entry-name="1" data-full-name="{{ item.name }}">{{ item.name }}</span>
          </button>
        </div>
      </div>
      <div
        class="fb-tree-children ml-4 hidden border-l border-base-300/70 pl-2"
        data-fb-children-for="{{ item.path }}"
        data-loaded="0"
      ></div>
    </div>
    {% else %}
    <div class="flex w-full min-w-0 items-center justify-between gap-1 rounded-lg border border-transparent px-0.5 py-0 transition fb-node-row" data-fb-node="1" data-kind="file" data-path="{{ item.path }}" data-fb-action="{% if root and root.capabilities and root.capabilities.can_view_text %}open-file{% else %}noop{% endif %}">
      <button
        type="button"
        class="fb-node-label min-w-0 flex flex-1 items-center gap-1 rounded-md px-0.5 py-0 text-left"
        data-fb-action="{% if root and root.capabilities and root.capabilities.can_view_text %}open-file{% else %}noop{% endif %}"
        data-path="{{ item.path }}"
      >
        <span class="ml-5 grid h-4 w-4 shrink-0 place-items-center text-base-content/60">
          <svg class="h-3.5 w-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" aria-hidden="true">
            <path d="M4 1.75h3.25l2.5 2.5v7.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/>
            <path d="M7.25 1.75v2.5h2.5"/>
          </svg>
        </span>
        <span class="fb-node-name truncate" title="{{ item.name }}" data-fb-entry-name="1" data-full-name="{{ item.name }}">{{ item.name }}</span>
      </button>
      <div class="ml-1.5 flex shrink-0 items-center gap-1">
        <span class="fb-node-size fb-code-font">{{ item.size }}</span>
        {% if root and root.capabilities and root.capabilities.can_download %}
        <button
          type="button"
          class="btn btn-ghost btn-xs h-5 min-h-5 px-0.5 opacity-0 transition"
          data-fb-action="download"
          data-path="{{ item.path }}"
          aria-label="Download file"
          title="Download file"
        >
          <svg class="h-3.5 w-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" aria-hidden="true">
            <path d="M7 2.25v6"/>
            <path d="M5 6.75l2 2 2-2"/>
            <path d="M2.75 9.75v1.5a1 1 0 0 0 1 1h6.5a1 1 0 0 0 1-1v-1.5"/>
          </svg>
        </button>
        {% endif %}
      </div>
    </div>
    {% endif %}
    {% endfor %}
  </div>

  {% if entries | length == 0 %}
  <div class="px-3 py-6 text-center text-xs text-base-content/55">No entries in this folder</div>
  {% endif %}
</div>
