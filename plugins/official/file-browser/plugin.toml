[plugin]
name = "file-browser"
version = "0.1.0"
description = "Public web file browser"
entry = "init.lua"
kind = "official"

[permissions]
routes = true
commands = false
admin = false
database = false

[file_browser]
route_prefix = "/app/files"
hide_dotfiles = true
deny_symlink = true
text_extensions = [
  "txt",
  "md",
  "markdown",
  "mdx",
  "rst",
  "adoc",
  "org",
  "tex",
  "bib",
  "json",
  "jsonl",
  "ndjson",
  "toml",
  "yaml",
  "yml",
  "ini",
  "conf",
  "cfg",
  "config",
  "env",
  "properties",
  "editorconfig",
  "gitignore",
  "gitattributes",
  "gitmodules",
  "csv",
  "tsv",
  "log",
  "lock",
  "diff",
  "patch",
  "lua",
  "rs",
  "js",
  "jsx",
  "mjs",
  "cjs",
  "ts",
  "tsx",
  "mts",
  "cts",
  "py",
  "rb",
  "php",
  "java",
  "kt",
  "kts",
  "go",
  "c",
  "h",
  "cc",
  "hh",
  "cpp",
  "hpp",
  "cxx",
  "hxx",
  "cs",
  "meta",
  "swift",
  "scala",
  "sql",
  "ps1",
  "bat",
  "cmd",
  "zsh",
  "bash",
  "fish",
  "css",
  "scss",
  "sass",
  "less",
  "html",
  "htm",
  "vue",
  "svelte",
  "astro",
  "xml",
  "svg",
  "graphql",
  "gql",
  "proto",
  "pem",
  "pub",
  "crt",
  "cer",
  "key",
  "asc",
  "sh",
]

# Configure one or more roots in deployment environments.

[[file_browser.roots]]
id = "docs"
title = "Documents"
path = "httpshared"

[file_browser.roots.capabilities]
can_list = true
can_view_text = true
can_edit_text = true
can_create_text = true
can_create_dir = true
can_rename = true
can_delete = true
can_upload = true
can_download = true

[[file_browser.roots]]
id = "temp"
title = "Temporary Documents"
path = "temp"

[file_browser.roots.capabilities]
can_list = true
can_view_text = true
can_edit_text = true
can_create_text = true
can_create_dir = true
can_rename = true
can_delete = true
can_upload = true
can_download = true
